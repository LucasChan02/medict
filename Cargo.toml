[workspace]
members = [
    "crates/medict-core",
    "crates/medict-app",
]
resolver = "2"

[workspace.package]
version = "4.0.3"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
csv = "1.3"
flate2 = "1.0"
html-escape = "0.2"
log = "0.4"
md5 = "0.7"
mdictlib = { version = "0.2.8", features = ["lzo"] }
mime_guess = "2.0"
open = "5"
percent-encoding = "2.3"
regex = "1.11"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
strsim = "0.11"
tempfile = "3"
thiserror = "2"
tiny_http = "0.12"
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
