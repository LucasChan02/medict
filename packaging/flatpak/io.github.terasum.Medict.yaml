app-id: io.github.terasum.Medict
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: "6.10"
command: medict
appstream-compose: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
  - --env=QTWEBENGINE_DICTIONARIES_PATH=/app/qtwebengine_dictionaries

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - name: extra-cmake-modules
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://download.kde.org/stable/frameworks/6.31/extra-cmake-modules-6.31.0.tar.xz
        sha256: 8f74af329e4c918358bfe54316f8cf4d530c28444595a3e2fb15075f72877f17

  - name: kirigami
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
      - -DBUILD_EXAMPLES=OFF
    sources:
      - type: archive
        url: https://download.kde.org/stable/frameworks/6.31/kirigami-6.31.0.tar.xz
        sha256: 811a8a150e636216269c0346e62470997fa282113a39e32b2d332bd5969926f0

  - name: medict
    buildsystem: simple
    build-commands:
      - cmake -S qt -B qt-build -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_INSTALL_PREFIX=/app
        -DCMAKE_PREFIX_PATH=/app
        -DMEDICT_BACKEND_BINARY=/run/build/medict/medictd
        -DMEDICT_VERSION=4.0.0
      - cmake --build qt-build --parallel
      - cmake --install qt-build
    sources:
      - type: dir
        path: ../../qt
        dest: qt
      - type: dir
        path: ../../packaging
        dest: packaging
      - type: file
        path: ../../build/appicon.png
        dest: build
      - type: file
        path: ../../medictd
        dest: .

