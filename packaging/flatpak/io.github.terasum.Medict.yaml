app-id: io.github.terasum.Medict
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: "6.10"
command: medict
appstream-compose: false
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
  - --env=QTWEBENGINE_DICTIONARIES_PATH=/app/qtwebengine_dictionaries

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - name: medict
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin
      - if [ -x /usr/lib/qt6/bin/qmake ]; then ln -sf /usr/lib/qt6/bin/qmake /app/bin/qmake; elif [ -x /usr/bin/qmake6 ]; then ln -sf /usr/bin/qmake6 /app/bin/qmake; fi
      - . /usr/lib/sdk/rust-stable/enable.sh
      - export PATH=/app/bin:$PATH
      - cargo build --release --locked --offline
        --config 'source.crates-io.replace-with="vendored-sources"'
        --config 'source.vendored-sources.directory="vendor"'
      - install -Dm755 target/release/medict /app/bin/medict
      - install -Dm644 packaging/linux/io.github.terasum.Medict.desktop /app/share/applications/io.github.terasum.Medict.desktop
      - install -Dm644 packaging/linux/io.github.terasum.Medict.metainfo.xml /app/share/metainfo/io.github.terasum.Medict.metainfo.xml
      - install -Dm644 packaging/linux/io.github.terasum.Medict.png /app/share/icons/hicolor/256x256/apps/io.github.terasum.Medict.png
      - find /app/translations/qtwebengine_locales -type f -name '*.pak'
        ! -name 'en-US.pak' ! -name 'zh-CN.pak' ! -name 'zh-TW.pak' -delete
      - rm -f /app/lib/libexec/webenginedriver
        /app/resources/qtwebengine_devtools_resources.pak
    sources:
      - type: dir
        path: ../../crates
        dest: crates
      - type: dir
        path: ../../assets
        dest: assets
      - type: dir
        path: ../../packaging
        dest: packaging
      - type: dir
        path: ../../vendor
        dest: vendor
      - type: file
        path: ../../Cargo.toml
        dest-filename: Cargo.toml
      - type: file
        path: ../../Cargo.lock
        dest-filename: Cargo.lock
      - type: file
        path: ../../VERSION
        dest-filename: VERSION
      - type: file
        path: ../../LICENSE
        dest-filename: LICENSE
