name: Rust CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

jobs:
  linux:
    name: Build and test Rust workspace
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            libclang-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Qt
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: '6.10.0'
          arch: linux_gcc_64
          modules: 'qtwebengine qtwebchannel qtpositioning'
          cache: true

      - name: Configure Qt environment
        run: |
          echo "$QT_ROOT_DIR/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$QT_ROOT_DIR/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Test Rust core
        run: cargo test -p medict-core
