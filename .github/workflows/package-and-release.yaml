name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag. It must match VERSION, for example v4.0.3'
        required: true
        default: 'v4.0.3'

permissions:
  contents: write

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ env.VERSION }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must contain a three-segment version, got '$version'." >&2
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Release tag '$RELEASE_TAG' must match VERSION 'v$version'." >&2
            exit 1
          fi

  windows:
    name: Windows Portable EXE
    runs-on: windows-2022
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSVC
        shell: pwsh
        run: ./packaging/ci/setup-msvc.ps1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Qt
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: '6.10.0'
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtwebchannel qtpositioning qtshadertools'
          cache: true

      - name: Add Qt to PATH
        shell: pwsh
        run: '"$env:QT_ROOT_DIR\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - name: Cache ECM and Kirigami
        uses: actions/cache@v6
        with:
          path: |
            build/downloads
            build/kf6-prefix
          key: kf6-${{ runner.os }}-6.31.0-qt6.10.0-msvc2022-rust-v1

      - name: Download ECM and Kirigami sources
        shell: pwsh
        timeout-minutes: 5
        run: ./packaging/ci/build-kirigami.ps1 -Stage Download

      - name: Build ECM
        shell: pwsh
        timeout-minutes: 8
        run: ./packaging/ci/build-kirigami.ps1 -Stage ECM

      - name: Build Kirigami
        shell: pwsh
        timeout-minutes: 25
        run: ./packaging/ci/build-kirigami.ps1 -Stage Kirigami

      - name: Generate Cargo lockfile
        shell: pwsh
        run: cargo generate-lockfile

      - name: Build Rust application
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -LiteralPath VERSION -Raw).Trim()
          "PACKAGE_VERSION=$packageVersion" >> $env:GITHUB_ENV
          "QML_IMPORT_PATH=$PWD\build\kf6-prefix\qml;$env:QT_ROOT_DIR\qml" >> $env:GITHUB_ENV
          cargo build --release --locked -p medict_app --bin medict

      - name: Stage application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $stage = Join-Path $PWD 'stage'
          $kf6 = Join-Path $PWD 'build/kf6-prefix'
          $kf6Qml = Join-Path $kf6 'qml'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item -LiteralPath 'target\release\medict.exe' -Destination (Join-Path $stage 'Medict.exe') -Force

          New-Item -ItemType Directory -Force (Join-Path $stage 'qml') | Out-Null
          if (Test-Path -LiteralPath $kf6Qml) {
            Copy-Item -Path (Join-Path $kf6Qml '*') -Destination (Join-Path $stage 'qml') -Recurse -Force
          }
          foreach ($runtimeDir in @($kf6, (Join-Path $kf6 'bin'), (Join-Path $kf6 'lib'))) {
            if (Test-Path -LiteralPath $runtimeDir) {
              Get-ChildItem -LiteralPath $runtimeDir -File -Filter '*.dll' |
                ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $stage -Force }
            }
          }

          $env:PATH = "$env:QT_ROOT_DIR\bin;$kf6\bin;$kf6\lib;$kf6;$env:PATH"
          $env:QML_IMPORT_PATH = "$stage\qml;$env:QT_ROOT_DIR\qml"
          $env:QML2_IMPORT_PATH = $env:QML_IMPORT_PATH
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release `
            --no-compiler-runtime `
            --qmldir "$PWD\crates\medict-app\src\qml" `
            --dir $stage `
            "$stage\Medict.exe"
          if ($LASTEXITCODE -ne 0) {
            throw 'windeployqt failed.'
          }

          if (Test-Path -LiteralPath $kf6Qml) {
            Copy-Item -Path (Join-Path $kf6Qml '*') -Destination (Join-Path $stage 'qml') -Recurse -Force
          }
          foreach ($runtimeDir in @($kf6, (Join-Path $kf6 'bin'), (Join-Path $kf6 'lib'))) {
            if (Test-Path -LiteralPath $runtimeDir) {
              Get-ChildItem -LiteralPath $runtimeDir -File -Filter '*.dll' |
                ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $stage -Force }
            }
          }

          foreach ($required in @(
              'Qt6Core.dll',
              'Qt6Qml.dll',
              'Qt6Quick.dll',
              'Qt6WebEngineCore.dll',
              'Qt6WebEngineQuick.dll',
              'QtWebEngineProcess.exe',
              'qml\org\kde\kirigami\qmldir',
              'resources\qtwebengine_resources.pak',
              'resources\v8_context_snapshot.bin',
              'resources\icudtl.dat')) {
            if (-not (Test-Path -LiteralPath (Join-Path $stage $required))) {
              throw "The staged application is missing $required."
            }
          }
          if (-not (Get-ChildItem -LiteralPath (Join-Path $stage 'qml\org\kde\kirigami') `
                  -Recurse -File -Filter '*plugin*.dll')) {
            throw 'The staged application is missing the Kirigami QML plugin.'
          }
          if (-not (Get-ChildItem -LiteralPath $stage -File -Filter '*Kirigami*.dll')) {
            throw 'The staged application is missing the Kirigami runtime library.'
          }

          if (-not $env:VCToolsRedistDir) {
            throw 'VCToolsRedistDir is not set.'
          }
          $crt = Get-ChildItem -LiteralPath $env:VCToolsRedistDir -Directory -Recurse |
            Where-Object {
              $_.Name -like 'Microsoft.VC*.CRT' -and $_.FullName -match '\\x64\\'
            } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $crt) {
            throw 'The x64 MSVC runtime directory was not found.'
          }
          Copy-Item -Path (Join-Path $crt.FullName '*.dll') -Destination $stage -Force
          Remove-Item -LiteralPath (Join-Path $stage 'vc_redist.x64.exe') -Force -ErrorAction SilentlyContinue
          foreach ($runtime in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $stage $runtime))) {
              throw "The portable application is missing $runtime."
            }
          }

      - name: Smoke test staged application
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $env:QML_IMPORT_PATH = ''
          $env:QML2_IMPORT_PATH = ''
          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -and $_ -notlike "$env:QT_ROOT_DIR*" -and $_ -notlike "$PWD\build\kf6-prefix*"
          }) -join ';'
          $env:QT_QUICK_BACKEND = 'software'
          $env:QTWEBENGINE_DISABLE_SANDBOX = '1'
          $env:QTWEBENGINE_CHROMIUM_FLAGS = '--disable-gpu --disable-dev-shm-usage'
          $env:MEDICT_SMOKE_TEST = '1'
          $marker = Join-Path $PWD 'stage/smoke-ok'
          Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue
          $env:MEDICT_SMOKE_MARKER = $marker
          $stdout = Join-Path $PWD 'stage/smoke-stdout.log'
          $stderr = Join-Path $PWD 'stage/smoke-stderr.log'
          $process = Start-Process `
            -FilePath "$PWD\stage\Medict.exe" `
            -WindowStyle Hidden `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru
          $deadline = [DateTime]::UtcNow.AddSeconds(90)
          while (-not $process.HasExited `
              -and -not (Test-Path -LiteralPath $marker) `
              -and [DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Milliseconds 500
            $process.Refresh()
          }
          $exitCode = if ($process.HasExited) { $process.ExitCode } else { $null }
          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force
            $process.WaitForExit()
          }
          foreach ($log in @($stdout, $stderr)) {
            if (Test-Path -LiteralPath $log) {
              Write-Host "--- $log ---"
              Get-Content -LiteralPath $log
            }
          }
          if (-not (Test-Path -LiteralPath $marker)) {
            throw "The staged application did not complete its feature smoke test (exit $exitCode)."
          }

      - name: Build portable EXE
        shell: pwsh
        run: |
          $stage = (Resolve-Path stage).Path
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force $dist | Out-Null

          $sevenZipPath = $null
          $candidates = @(
            (Join-Path $env:ProgramFiles '7-Zip\7z.exe'),
            (Join-Path ${env:ProgramFiles(x86)} '7-Zip\7z.exe'),
            (Join-Path $env:ChocolateyInstall 'lib\7zip\tools\7-Zip\7z.exe')
          )
          foreach ($candidate in $candidates) {
            if (Test-Path -LiteralPath $candidate) {
              $sevenZipPath = $candidate
              break
            }
          }
          if (-not $sevenZipPath) {
            choco install 7zip --no-progress -y
            $sevenZipCommand = Get-Command 7z -ErrorAction SilentlyContinue
            if ($sevenZipCommand) {
              $sevenZipPath = $sevenZipCommand.Source
            }
          }
          if (-not $sevenZipPath) {
            $candidate = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
            if (Test-Path -LiteralPath $candidate) {
              $sevenZipPath = $candidate
            }
          }
          if (-not $sevenZipPath) {
            throw '7-Zip was not found.'
          }
          $sfx = Join-Path (Split-Path $sevenZipPath) '7z.sfx'
          if (-not (Test-Path -LiteralPath $sfx)) {
            $sfx = Get-ChildItem -LiteralPath $env:ChocolateyInstall `
              -Recurse -File -Filter '7z.sfx' |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not (Test-Path -LiteralPath $sfx)) {
            throw 'The 7-Zip SFX module was not found.'
          }

          Remove-Item -Path (Join-Path $stage 'smoke-*') -Force -ErrorAction SilentlyContinue
          $portableStage = Join-Path $PWD 'portable-stage'
          Remove-Item -LiteralPath $portableStage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $portableStage | Out-Null
          Copy-Item -Path (Join-Path $stage '*') -Destination $portableStage -Recurse
          $config = @(
            ';!@Install@!UTF-8!'
            'Title="Medict"'
            'RunProgram="Medict.exe"'
            "InstallPath=`"%TEMP%\\Medict-$env:PACKAGE_VERSION`""
            'OverwriteMode="2"'
            'GUIMode="2"'
            ';!@InstallEnd@!'
          ) -join "`n"
          $config += "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $portableStage 'config.txt'),
            $config,
            [System.Text.UTF8Encoding]::new($false)
          )
          $portable = Join-Path $dist "Medict-$env:PACKAGE_VERSION-windows-x86_64.exe"
          Push-Location $portableStage
          try {
            & $sevenZipPath a -t7z -mx=9 "-sfx$sfx" $portable '*'
          } finally {
            Pop-Location
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'Portable EXE packaging failed.'
          }

      - name: Smoke test portable EXE
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $env:QML_IMPORT_PATH = ''
          $env:QML2_IMPORT_PATH = ''
          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -and $_ -notlike "$env:QT_ROOT_DIR*" -and $_ -notlike "$PWD\build\kf6-prefix*"
          }) -join ';'
          $env:QT_QUICK_BACKEND = 'software'
          $env:QTWEBENGINE_DISABLE_SANDBOX = '1'
          $env:QTWEBENGINE_CHROMIUM_FLAGS = '--disable-gpu --disable-dev-shm-usage'
          $env:MEDICT_SMOKE_TEST = '1'
          $marker = Join-Path $PWD 'dist/portable-smoke-ok'
          Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue
          $env:MEDICT_SMOKE_MARKER = $marker
          $portable = Join-Path $PWD "dist/Medict-$env:PACKAGE_VERSION-windows-x86_64.exe"
          $process = Start-Process -FilePath $portable -WindowStyle Hidden -PassThru
          $deadline = [DateTime]::UtcNow.AddSeconds(120)
          while (-not $process.HasExited `
              -and -not (Test-Path -LiteralPath $marker) `
              -and [DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Milliseconds 500
            $process.Refresh()
          }
          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force
            $process.WaitForExit()
          }
          if (-not (Test-Path -LiteralPath $marker)) {
            throw 'The portable EXE did not complete its feature smoke test.'
          }

      - name: Upload portable EXE
        uses: actions/upload-artifact@v7
        with:
          name: Medict-windows-x86_64
          path: dist/*.exe
          if-no-files-found: error

  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            desktop-file-utils \
            libasound2 \
            libasound2-dev \
            libclang-dev \
            libfuse2 \
            libgl1-mesa-dev \
            libnss3 \
            libnss3-dev \
            libx11-xcb-dev \
            libxcb-cursor0 \
            libxcb-cursor-dev \
            libxcb-icccm4 \
            libxcb-icccm4-dev \
            libxcb-image0 \
            libxcb-image0-dev \
            libxcb-keysyms1 \
            libxcb-keysyms1-dev \
            libxcb-render-util0 \
            libxcb-render-util0-dev \
            libxcb-shape0 \
            libxcb-shape0-dev \
            libxcb-xinerama0 \
            libxcb-xinerama0-dev \
            libxcb-xkb1 \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxkbcommon-x11-dev \
            ninja-build \
            patchelf \
            xvfb

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Qt
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: '6.10.0'
          arch: linux_gcc_64
          modules: 'qtwebengine qtwebchannel qtpositioning qtshadertools'
          cache: true

      - name: Cache ECM and Kirigami
        uses: actions/cache@v6
        with:
          path: |
            build/downloads
            build/kf6-prefix
          key: kf6-${{ runner.os }}-6.31.0-qt6.10.0-gcc-rust-v1

      - name: Build ECM and Kirigami
        run: sh packaging/ci/build-kirigami.sh

      - name: Build Rust application
        run: |
          export PACKAGE_VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "$QT_ROOT_DIR/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$QT_ROOT_DIR/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          cargo generate-lockfile
          cargo build --release --locked -p medict_app --bin medict

      - name: Deploy Qt and Kirigami
        run: |
          set -eu
          KIRIGAMI_PREFIX="$PWD/build/kf6-prefix"
          KIRIGAMI_QML="$KIRIGAMI_PREFIX/lib/qt6/qml/org/kde"
          test -f "$KIRIGAMI_QML/kirigami/qmldir"

          install -d AppDir/usr/bin AppDir/usr/qml/org AppDir/usr/lib
          install -Dm755 target/release/medict AppDir/usr/bin/medict
          cp -a "$KIRIGAMI_QML" AppDir/usr/qml/org/
          find "$KIRIGAMI_PREFIX/lib" -maxdepth 1 \( -type f -o -type l \) \
            \( -name 'libKirigami*.so*' -o -name 'libKF6Kirigami*.so*' \) \
            -exec cp -a -t AppDir/usr/lib {} +

          curl -fL -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fL -o linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export EXTRA_QT_MODULES="webenginecore webenginequick webchannel positioning"
          export QML_SOURCES_PATHS="$PWD/crates/medict-app/src/qml"
          export QML_MODULES_PATHS="$KIRIGAMI_PREFIX/lib/qt6/qml:$QT_ROOT_DIR/qml"
          export QML_IMPORT_PATH="$QML_MODULES_PATHS"
          export LD_LIBRARY_PATH="$KIRIGAMI_PREFIX/lib:$QT_ROOT_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --executable AppDir/usr/bin/medict \
            --desktop-file packaging/linux/io.github.terasum.Medict.desktop \
            --icon-file packaging/linux/io.github.terasum.Medict.png

          webengine_process="$(find "$QT_ROOT_DIR" -type f -name QtWebEngineProcess -print -quit)"
          test -n "$webengine_process"
          install -Dm755 "$webengine_process" AppDir/usr/libexec/QtWebEngineProcess
          install -d AppDir/usr/resources
          find "$QT_ROOT_DIR" -maxdepth 3 -type f \
            \( -name 'qtwebengine_resources*.pak' \
               -o -name 'icudtl.dat' \
               -o -name 'v8_context_snapshot.bin' \) \
            -exec cp -a -t AppDir/usr/resources {} +
          if [ -d "$QT_ROOT_DIR/translations/qtwebengine_locales" ]; then
            install -d AppDir/usr/translations
            cp -a "$QT_ROOT_DIR/translations/qtwebengine_locales" \
              AppDir/usr/translations/
          fi

      - name: Stage and verify AppImage runtime
        run: |
          set -eu
          install -Dm755 packaging/linux/AppRun AppDir/AppRun
          install -Dm644 packaging/linux/io.github.terasum.Medict.desktop \
            AppDir/io.github.terasum.Medict.desktop
          install -Dm644 packaging/linux/io.github.terasum.Medict.png \
            AppDir/io.github.terasum.Medict.png
          ln -sfn io.github.terasum.Medict.png AppDir/.DirIcon

          test -x AppDir/usr/bin/medict
          test -f AppDir/usr/qml/org/kde/kirigami/qmldir
          find AppDir/usr/qml/org/kde/kirigami -maxdepth 1 -type f \
            -name '*plugin*.so' -print -quit | grep -q .
          find AppDir/usr/lib -maxdepth 1 \( -type f -o -type l \) \
            \( -name 'libKirigami*.so*' -o -name 'libKF6Kirigami*.so*' \) \
            -print -quit | grep -q .
          test -f AppDir/usr/lib/libQt6Core.so.6
          test -f AppDir/usr/lib/libQt6Qml.so.6
          test -f AppDir/usr/lib/libQt6WebEngineCore.so.6
          find AppDir/usr -type f -name 'QtWebEngineProcess' -print -quit | grep -q .
          find AppDir/usr -type f -name 'qtwebengine_resources*.pak' -print -quit | grep -q .
          test -f AppDir/usr/resources/v8_context_snapshot.bin
          test -f AppDir/usr/resources/icudtl.dat

          du -sh AppDir
          du -ah AppDir | sort -rh | head -n 30

      - name: Build AppImage
        run: |
          curl -fL -o appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          mkdir -p dist
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-x86_64.AppImage \
            AppDir "dist/Medict-${PACKAGE_VERSION}-linux-x86_64.AppImage"
          ls -lh dist/*.AppImage

      - name: Smoke test AppImage
        timeout-minutes: 3
        run: |
          set -eu
          marker="$(mktemp)"
          rm -f "$marker"
          set +e
          MEDICT_SMOKE_MARKER="$marker" \
          timeout 90s xvfb-run -a env \
            QTWEBENGINE_DISABLE_SANDBOX=1 \
            QT_QUICK_BACKEND=software \
            APPIMAGE_EXTRACT_AND_RUN=1 \
            "dist/Medict-${PACKAGE_VERSION}-linux-x86_64.AppImage" --smoke-test
          status=$?
          set -e
          if [ ! -f "$marker" ]; then
            echo "The AppImage did not complete its feature smoke test (exit $status)." >&2
            exit 1
          fi

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: Medict-linux-x86_64-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  linux-flatpak:
    name: Linux Flatpak
    runs-on: ubuntu-22.04
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare Cargo lockfile and vendored sources
        run: |
          cargo generate-lockfile
          cargo vendor vendor

      - name: Build Flatpak
        run: |
          export PACKAGE_VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak-builder \
            --user \
            --install-deps-from=flathub \
            --disable-rofiles-fuse \
            --repo=repo \
            --force-clean \
            builddir \
            packaging/flatpak/io.github.terasum.Medict.yaml
          du -sh builddir/files repo
          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            repo \
            "dist/Medict-${PACKAGE_VERSION}-linux-x86_64.flatpak" \
            io.github.terasum.Medict
          ls -lh dist/*.flatpak

      - name: Upload Flatpak
        uses: actions/upload-artifact@v7
        with:
          name: Medict-linux-x86_64-flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - windows
      - linux-appimage
      - linux-flatpak
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: List package artifacts
        run: ls -lhR assets

      - name: Collect release notes
        id: notes
        run: |
          {
            echo "body<<EOF"
            awk '/^## /{count++} count==1{print} count==2{exit}' CHANGELOG.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.VERSION }}
          name: Medict ${{ env.VERSION }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            assets/*.exe
            assets/*.AppImage
            assets/*.flatpak
          draft: ${{ github.event_name == 'workflow_dispatch' }}
