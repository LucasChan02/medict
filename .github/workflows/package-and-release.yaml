name: Release

# Push a v* tag to publish a release. Run the workflow manually to make a
# draft release for inspection without publishing it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag; it must match VERSION, for example v4.0.1'
        required: true
        default: 'v4.0.1'

permissions:
  contents: write

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ env.VERSION }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must contain a three-segment version, got '$version'." >&2
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Release tag '$RELEASE_TAG' must match VERSION 'v$version'." >&2
            exit 1
          fi

  windows:
    name: Windows EXE
    runs-on: windows-2022
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'

      - name: Set up Qt
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: '6.10.0'
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtwebchannel qtpositioning qtserialport qtshadertools'
          cache: true

      - name: Set up MSVC
        shell: pwsh
        run: ./packaging/ci/setup-msvc.ps1

      - name: Cache ECM and Kirigami
        uses: actions/cache@v6
        with:
          path: |
            build/downloads
            build/kf6-prefix
          key: kf6-${{ runner.os }}-6.31.0-qt6.10.0-msvc2022-v2

      - name: Download ECM and Kirigami sources
        shell: pwsh
        timeout-minutes: 5
        run: ./packaging/ci/build-kirigami.ps1 -Stage Download

      - name: Build ECM
        shell: pwsh
        timeout-minutes: 5
        run: ./packaging/ci/build-kirigami.ps1 -Stage ECM

      - name: Build Kirigami
        shell: pwsh
        timeout-minutes: 20
        run: ./packaging/ci/build-kirigami.ps1 -Stage Kirigami

      - name: Build dictionary backend
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -LiteralPath VERSION -Raw).Trim()
          "PACKAGE_VERSION=$packageVersion" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force build | Out-Null
          go build -trimpath `
            -ldflags "-s -w -H=windowsgui -X main.Version=$env:VERSION" `
            -o build/medictd.exe ./cmd/medictd

      - name: Configure Qt client
        shell: pwsh
        run: |
          cmake -S qt -B build/qt -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR;$PWD/build/kf6-prefix" `
            -DMEDICT_BACKEND_BINARY="$PWD/build/medictd.exe" `
            -DMEDICT_VERSION="$env:PACKAGE_VERSION"

      - name: Build Qt client
        shell: pwsh
        run: cmake --build build/qt --parallel

      - name: Stage application
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'stage'
          cmake --install build/qt --prefix $stage
          cmake --install build/kirigami-build --prefix $stage
          $env:QML_IMPORT_PATH = "$env:QT_ROOT_DIR\qml;$PWD\build\kf6-prefix\qml"
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release `
            --compiler-runtime `
            --qmldir "$PWD\qt\qml" `
            --dir $stage `
            "$stage\Medict.exe"

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $stage = (Resolve-Path stage).Path
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force $dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$env:PACKAGE_VERSION" `
            "/DStageDir=$stage" `
            "/DOutputDir=$dist" `
            "packaging\windows\medict.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Medict-windows-x86_64
          path: dist/*.exe
          if-no-files-found: error

  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            libasound2 \
            libasound2-dev \
            libfuse2 \
            libgl1-mesa-dev \
            libnss3 \
            libnss3-dev \
            libsqlite3-dev \
            libx11-xcb-dev \
            libxcb-cursor0 \
            libxcb-cursor-dev \
            libxcb-icccm4 \
            libxcb-icccm4-dev \
            libxcb-image0 \
            libxcb-image0-dev \
            libxcb-keysyms1 \
            libxcb-keysyms1-dev \
            libxcb-render-util0 \
            libxcb-render-util0-dev \
            libxcb-shape0 \
            libxcb-shape0-dev \
            libxcb-xinerama0 \
            libxcb-xinerama0-dev \
            libxcb-xkb1 \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxkbcommon-x11-dev \
            ninja-build \
            patchelf

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'

      - name: Set up Qt
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: '6.10.0'
          arch: linux_gcc_64
          modules: 'qtwebengine qtwebchannel qtpositioning qtserialport qtshadertools'
          cache: true

      - name: Cache ECM and Kirigami
        uses: actions/cache@v6
        with:
          path: |
            build/downloads
            build/kf6-prefix
          key: kf6-${{ runner.os }}-6.31.0-qt6.10.0-gcc-v1

      - name: Build ECM and Kirigami
        run: sh packaging/ci/build-kirigami.sh

      - name: Build dictionary backend
        run: |
          export PACKAGE_VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          mkdir -p build dist AppDir
          go build -trimpath \
            -ldflags "-s -w -X main.Version=$VERSION" \
            -o build/medictd ./cmd/medictd

      - name: Build Qt client
        run: |
          cmake -S qt -B build/qt -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$PWD/build/kf6-prefix" \
            -DMEDICT_BACKEND_BINARY="$PWD/build/medictd" \
            -DMEDICT_VERSION="$PACKAGE_VERSION"
          cmake --build build/qt --parallel
          DESTDIR="$PWD/AppDir" cmake --install build/qt

      - name: Stage AppImage
        run: |
          install -Dm755 packaging/linux/AppRun AppDir/AppRun
          install -Dm644 packaging/linux/io.github.terasum.Medict.desktop \
            AppDir/io.github.terasum.Medict.desktop
          install -Dm644 packaging/linux/io.github.terasum.Medict.png \
            AppDir/io.github.terasum.Medict.png
          ln -sfn io.github.terasum.Medict.png AppDir/.DirIcon
          du -sh AppDir
          du -ah AppDir | sort -rh | head -n 30

      - name: Build AppImage
        run: |
          curl -fL -o appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-x86_64.AppImage \
            AppDir "dist/Medict-${PACKAGE_VERSION}-linux-x86_64.AppImage"
          ls -lh dist/*.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: Medict-linux-x86_64-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  linux-flatpak:
    name: Linux Flatpak
    runs-on: ubuntu-22.04
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'

      - name: Build dictionary backend
        run: |
          export PACKAGE_VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.Version=$VERSION" \
            -o medictd ./cmd/medictd

      - name: Build Flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak-builder \
            --user \
            --install-deps-from=flathub \
            --disable-rofiles-fuse \
            --repo=repo \
            --force-clean \
            builddir \
            packaging/flatpak/io.github.terasum.Medict.yaml
          du -sh builddir/files repo
          du -ah builddir/files | sort -rh | head -n 40
          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            repo \
            "dist/Medict-${PACKAGE_VERSION}-linux-x86_64.flatpak" \
            io.github.terasum.Medict
          ls -lh dist/*.flatpak

      - name: Upload Flatpak
        uses: actions/upload-artifact@v7
        with:
          name: Medict-linux-x86_64-flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - windows
      - linux-appimage
      - linux-flatpak
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: List package artifacts
        run: ls -lhR assets

      - name: Collect release notes
        id: notes
        run: |
          {
            echo "body<<EOF"
            awk '/^## /{count++} count==1{print} count==2{exit}' CHANGELOG.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.VERSION }}
          name: Medict ${{ env.VERSION }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            assets/*.exe
            assets/*.AppImage
            assets/*.flatpak
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ contains(env.VERSION, '-') }}
