name: CI

on:
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

jobs:
  backend:
    name: Go engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'

      - name: Build
        run: go build ./cmd/... ./pkg/... ./internal/...

      - name: Vet
        run: go vet ./cmd/... ./pkg/... ./internal/...

      - name: Test
        run: go test ./pkg/... ./internal/...

  qt-linux:
    name: Qt client (Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libnss3-dev \
            libsqlite3-dev \
            libx11-xcb-dev \
            libxcb-cursor-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            ninja-build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'

      - name: Set up Qt
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: '6.10.0'
          arch: linux_gcc_64
          modules: 'qtwebengine qtwebchannel qtpositioning qtserialport qtshadertools'
          cache: true

      - name: Cache ECM and Kirigami
        uses: actions/cache@v6
        with:
          path: |
            build/downloads
            build/kf6-prefix
          key: kf6-${{ runner.os }}-6.31.0-qt6.10.0-gcc-v1

      - name: Build ECM and Kirigami
        run: sh packaging/ci/build-kirigami.sh

      - name: Build dictionary backend
        run: go build -trimpath -o build/medictd ./cmd/medictd

      - name: Configure Qt client
        run: |
          cmake -S qt -B build/qt -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$PWD/build/kf6-prefix" \
            -DMEDICT_BACKEND_BINARY="$PWD/build/medictd"

      - name: Build Qt client
        run: cmake --build build/qt --parallel

  qt-windows:
    name: Qt client (Windows)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'

      - name: Set up Qt
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: '6.10.0'
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtwebchannel qtpositioning qtserialport qtshadertools'
          cache: true

      - name: Set up MSVC
        shell: pwsh
        run: ./packaging/ci/setup-msvc.ps1

      - name: Cache ECM and Kirigami
        uses: actions/cache@v6
        with:
          path: |
            build/downloads
            build/kf6-prefix
          key: kf6-${{ runner.os }}-6.31.0-qt6.10.0-msvc2022-v2

      - name: Download ECM and Kirigami sources
        shell: pwsh
        timeout-minutes: 5
        run: ./packaging/ci/build-kirigami.ps1 -Stage Download

      - name: Build ECM
        shell: pwsh
        timeout-minutes: 5
        run: ./packaging/ci/build-kirigami.ps1 -Stage ECM

      - name: Build Kirigami
        shell: pwsh
        timeout-minutes: 20
        run: ./packaging/ci/build-kirigami.ps1 -Stage Kirigami

      - name: Build dictionary backend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          go build -trimpath `
            -ldflags "-s -w -H=windowsgui" `
            -o build/medictd.exe ./cmd/medictd

      - name: Configure Qt client
        shell: pwsh
        run: |
          cmake -S qt -B build/qt -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR;$PWD/build/kf6-prefix" `
            -DMEDICT_BACKEND_BINARY="$PWD/build/medictd.exe"

      - name: Build Qt client
        shell: pwsh
        run: cmake --build build/qt --parallel
