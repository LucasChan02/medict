version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: '11:00'
    open-pull-requests-limit: 10
    target-branch: develop

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: '11:00'
    open-pull-requests-limit: 10
    target-branch: develop
